{% extends "base.html" %}

{% block content %}

<h1>Students</h1>

<table id="students-table">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Marks</th>
        <th>Actions</th>
    </tr>

    {% for student in students %}

    <tr>
        <td>{{ student[0] }}</td>
        <td>{{ student[1] }}</td>
        <td>{{ student[2] }}</td>
        <td>{{ student[3] }}</td>

        <td>
            <a href="/students/update/{{ student[0] }}">
                Update
            </a>

            <form method="POST"
                  action="/students/delete/{{ student[0] }}"
                  style="display:inline;">

                <button class="delete-button" type="submit">
                    Delete
                </button>

            </form>
        </td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
