```html
{% extends "base.html" %}

{% block content %}
<h1>Add Student</h1>

{% if error %}
    <p id="validation-error" class="error">{{ error }}</p>
{% endif %}

<form method="POST" action="/students/add">
    <label for="name">Name:</label><br>
    <input id="name" name="name" type="text"><br>

    <label for="age">Age:</label><br>
    <input id="age" name="age" type="number"><br>

    <label for="marks">Marks:</label><br>
    <input id="marks" name="marks" type="number" step="0.01"><br>

    <button id="add-student-button" type="submit">
        Add Student
    </button>
</form>
{% endblock %}
```
