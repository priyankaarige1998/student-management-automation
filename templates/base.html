<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        nav a {
            margin-right: 20px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        input {
            margin: 5px 0;
            padding: 6px;
        }

        button {
            padding: 6px 12px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/students/add">Add Student</a>
    <a href="/students">View Students</a>
    <a href="/students/search">Search Student</a>
</nav>

<hr>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
{% endwith %}

{% block content %}
{% endblock %}

</body>
</html>
